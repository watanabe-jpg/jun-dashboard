name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Push dist to GitHub
        run: |
          git config user.email "watanabe@ns.tokyoad.com"
          git config user.name "watanabe-jpg"
          git add -f dist/
          git diff --staged --quiet || git commit -m "build: update dist [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
